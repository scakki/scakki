name: Update public RoLAC activity

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - tests/**
      - .github/workflows/update-activity.yml

permissions:
  contents: write

concurrency:
  group: rolac-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check activity filtering and rendering
        run: python3 -B -m unittest discover -s tests
      - name: Render public activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_activity.py
      - name: Commit updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rolac-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update public RoLAC activity'
            git push
          fi
